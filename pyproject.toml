[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OneFlood"
version = "0.1.0"
description = "facilitating access to Level 3 Surface Water Data Products"
requires-python = ">=3.11, <3.14"

dependencies = [
    "boto3",
    "timezonefinder",
    "requests>=2.31",
    "earthaccess>=0.9",
    "numpy>=1.24",
    "boto3>=1.43", 
    "geopandas>=1.1",
]

[project.scripts]
oneflood = "oneflood.oneflood_main:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]

platforms = [
    "linux-64", 
    "osx-64",
    "osx-arm64",
    "win-64",
]

[tool.pixi.dependencies]
python = ">=3.11,<3.14" 
pytest = "*"

[tool.pixi.pypi-dependencies]
oneflood = { path = ".", editable = true }
build = "*"

[tool.pixi.tasks]
help = "oneflood --help" 
test = "python -m pytest" 
build = "python -m build" 


