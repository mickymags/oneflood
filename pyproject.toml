[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OneFlood"
version = "0.1.0"
description = "facilitating access to Level 3 Surface Water Data Products"
requires-python = ">=3.11"

dependencies = [
    "boto3",
    "timezonefinder",
    "requests>=2.31",
    "earthaccess>=0.9",
    "numpy>=1.24",
    "boto3>=1.43"
]

[project.scripts]
oneflood = "oneflood.oneflood_main:main"

[tool.setuptools.packages.find]
where=["src"]